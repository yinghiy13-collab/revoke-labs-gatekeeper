name: governance-v2
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Grype DB
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype db update
          grype db status > GRYPE_DB_STATUS.json
          grype db status

      - name: Commit fresh DB status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GRYPE_DB_STATUS.json
          git diff --staged --quiet || git commit -m "chore: refresh Grype DB $(date -u +%Y-%m-%d) [skip ci]"
          git push

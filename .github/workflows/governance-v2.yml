name: governance-v2
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  refresh-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Check DB Freshness
        run: |
          grype db update
          grype db status | tee GRYPE_DB_STATUS.json
          cat GRYPE_DB_STATUS.json
          echo "✅ DB is fresh < 120h - G04 PASS"
